name: arm64 images

# Builds the nine images docker-compose.coolify.yml runs, for arm64, on a native
# arm64 runner (free on public repositories), and pushes them to this fork's
# GHCR namespace. Run it by hand with the upstream release tag to build.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to build, e.g. v0.8.0'
        required: true
        default: 'v0.8.0'
      node:
        description: 'Node.js version for the base image (upstream v0.8.0 pins 24.18.0, which lacks the CVE-2026-111497 fix)'
        required: true
        default: '24.22.1'

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: api
            app: api
          - image: collector
            app: collector
          - image: worker
            app: worker
          - image: query-gateway
            app: query-gateway
          - image: realtime
            app: realtime
          - image: migrate
            app: worker
          - image: web
            dockerfile: infra/selfhost/web.Dockerfile
          - image: clickhouse
            dockerfile: infra/selfhost/clickhouse.Dockerfile
          - image: valkey
            dockerfile: infra/selfhost/valkey.Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          repository: OpenLabs-so/openanalytics
          ref: ${{ inputs.tag }}

      - id: repo
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openanalytics" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pin the Node.js base image
        run: |
          sed -i -E "s/^FROM node:[0-9.]+-slim/FROM node:${{ inputs.node }}-slim/" \
            infra/docker/node-app.Dockerfile infra/selfhost/web.Dockerfile
          grep -h '^FROM node' infra/docker/node-app.Dockerfile infra/selfhost/web.Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile || 'infra/docker/node-app.Dockerfile' }}
          platforms: linux/arm64
          push: true
          build-args: |
            APP=${{ matrix.app || '' }}
            GIT_COMMIT=${{ steps.repo.outputs.sha }}
          tags: ${{ steps.repo.outputs.name }}/${{ matrix.image }}:${{ inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
