name: arm64 images

# Builds the nine images docker-compose.coolify.yml runs, for arm64, on a native
# arm64 runner (free on public repositories), and pushes them to this fork's
# GHCR namespace as <tag> and <tag>-node<version>.
#
# The Node.js base image is replaced with the newest patch of the major the
# upstream release uses, so security releases reach us without waiting for
# upstream. Run by hand, or called by follow-upstream.yml.
#
# By hand it can also build a branch instead of a release: give `repository`
# and `ref` (e.g. toofast1/openanalytics and feat/dodo-revenue) and a `tag` of
# your own (e.g. v0.8.0-dodo.1), then point OA_IMAGE_TAG at it in Coolify. Such
# a tag is never one follow-upstream.yml looks for, so it cannot be mistaken for
# a release build.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag; the upstream release tag to build, e.g. v0.8.0'
        required: true
        type: string
      node:
        description: 'Node.js version (empty = newest patch of the major the source uses)'
        required: false
        type: string
      repository:
        description: 'Repository to build from'
        required: false
        type: string
        default: OpenLabs-so/openanalytics
      ref:
        description: 'Git ref to build (empty = the tag)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      node:
        required: false
        type: string
      repository:
        required: false
        type: string
        default: OpenLabs-so/openanalytics
      ref:
        required: false
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.node.outputs.version }}
    steps:
      - id: node
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ inputs.repository || 'OpenLabs-so/openanalytics' }}
          SOURCE_REF: ${{ inputs.ref || inputs.tag }}
          NODE_VERSION: ${{ inputs.node }}
        run: |
          set -euo pipefail
          version="$NODE_VERSION"
          if [ -z "$version" ]; then
            # The contents API rather than raw.githubusercontent.com, because a
            # branch ref may contain a slash and the raw URL cannot tell where
            # the ref ends and the path begins.
            major="$(gh api -H 'Accept: application/vnd.github.raw' \
                "repos/${SOURCE_REPO}/contents/infra/docker/node-app.Dockerfile?ref=${SOURCE_REF}" \
              | sed -nE 's/^FROM node:([0-9]+)\..*/\1/p' | head -1)"
            version="$(curl -fsSL https://nodejs.org/dist/index.json \
              | jq -r --arg m "v${major}." 'map(select(.version | startswith($m)))[0].version' | sed 's/^v//')"
          fi
          echo "Node.js $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: ${{ matrix.image }}
    needs: resolve
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: api
            app: api
          - image: collector
            app: collector
          - image: worker
            app: worker
          - image: query-gateway
            app: query-gateway
          - image: realtime
            app: realtime
          - image: migrate
            app: worker
          - image: web
            dockerfile: infra/selfhost/web.Dockerfile
          - image: clickhouse
            dockerfile: infra/selfhost/clickhouse.Dockerfile
          - image: valkey
            dockerfile: infra/selfhost/valkey.Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || 'OpenLabs-so/openanalytics' }}
          ref: ${{ inputs.ref || inputs.tag }}

      - id: repo
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openanalytics" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pin the Node.js base image
        run: |
          sed -i -E "s/^FROM node:[0-9.]+-slim/FROM node:${{ needs.resolve.outputs.node }}-slim/" \
            infra/docker/node-app.Dockerfile infra/selfhost/web.Dockerfile
          grep -h '^FROM node' infra/docker/node-app.Dockerfile infra/selfhost/web.Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile || 'infra/docker/node-app.Dockerfile' }}
          platforms: linux/arm64
          push: true
          build-args: |
            APP=${{ matrix.app || '' }}
            GIT_COMMIT=${{ steps.repo.outputs.sha }}
          tags: |
            ${{ steps.repo.outputs.name }}/${{ matrix.image }}:${{ inputs.tag }}
            ${{ steps.repo.outputs.name }}/${{ matrix.image }}:${{ inputs.tag }}-node${{ needs.resolve.outputs.node }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
